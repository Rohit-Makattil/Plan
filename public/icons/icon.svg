<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A77F" />
      <stop offset="100%" stop-color="#8F673C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03131" />
      <stop offset="100%" stop-color="#FA5252" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4A331C" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#EADCC9" stroke-width="4"/>
  
  <!-- Outer Clock Circle -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#warmGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 16"/>
  
  <!-- Inner Timezone Arcs (representing two synced worlds) -->
  <!-- User 1 Arc (Amber/Gold) -->
  <path d="M 256,136 A 120,120 0 0,1 376,256" fill="none" stroke="#FAB005" stroke-width="18" stroke-linecap="round"/>
  <!-- User 2 Arc (Terracotta/Warm) -->
  <path d="M 256,376 A 120,120 0 0,1 136,256" fill="none" stroke="#C9A77F" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Central Intersecting Heart & Clock Hands -->
  <circle cx="256" cy="256" r="16" fill="#8F673C"/>
  <line x1="256" y1="256" x2="256" y2="175" stroke="#4A331C" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="325" y2="256" stroke="#4A331C" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Intersecting Sparkle/Heart -->
  <path d="M 256,215 C 240,195 210,205 210,225 C 210,245 256,275 256,275 C 256,275 302,245 302,225 C 302,205 272,195 256,215 Z" fill="#E03131" opacity="0.88"/>
</svg>
